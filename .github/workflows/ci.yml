name: build

on:
  pull_request:
  push:
    branches: [ master ]
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build
        run: ./gradlew build

      - name: Determine version
        id: version
        run: |
          VERSION="$(./gradlew -q properties | awk '/^version:/ {print $2}')"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            STATUS=snapshot
          else
            STATUS=release
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION ($STATUS)"
          echo "### Version: \`$VERSION\` ($STATUS)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish snapshot
        if: steps.version.outputs.status == 'snapshot' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: >
          ./gradlew
          publishAllPublicationsToMinestomUnitedRepositoryRepository
          publishAllPublicationsToMavenCentralRepository
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish release
        if: steps.version.outputs.status == 'release' && github.ref == format('refs/tags/v{0}', steps.version.outputs.version)
        run: >
          ./gradlew
          publishAllPublicationsToMinestomUnitedRepositoryRepository
          publishAllPublicationsToMavenCentralRepository
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}